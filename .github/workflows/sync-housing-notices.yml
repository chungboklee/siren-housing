name: Sync official housing notices

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siren-notice-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/sync-notices.mjs --write
      - name: Build and validate site, RSS, and sitemap
        env:
          SIREN_SITE_URL: https://siren-housing.siren-kr.workers.dev
        run: npm run build
      - name: Publish verified changes to main
        run: |
          if git diff --quiet -- data/notices.json; then
            echo "No notice changes to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/notices.json
          git commit -m "Update official housing notices"
          git push origin HEAD:main
